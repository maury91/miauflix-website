<header class="site-header container">
  <a class="brand" href="index.html" aria-label="Miauflix home"
    ><img src="assets/logo.png" alt="Miauflix" width="500" height="156"
  /></a>
  <nav id="navigation" aria-label="Main navigation">
    <a href="features.html">Features</a><a href="index.html#how-it-works">How it works</a
    ><a href="https://github.com/maury91/miauflix/tree/main/docs">Docs</a
    ><a href="https://github.com/maury91/miauflix">GitHub</a>
    <a class="button button-small" href="index.html#get-started">Get started</a>
  </nav>
  <button
    class="theme-toggle icon-button"
    type="button"
    aria-label="Switch to light theme"
    aria-pressed="false"
  >
    {{icon:moon}}{{icon:sun}}
  </button>
  <button
    class="menu-toggle icon-button"
    type="button"
    aria-label="Open navigation"
    aria-controls="navigation"
    aria-expanded="false"
  >
    {{icon:menu}}
  </button>
</header>
